    <!-- Background (Day/Night switch) -->
    <script>
        (function () {
            const hour = new Date().getHours();
            // Consistent night window for everything (globe + background)
            const isNight = (hour >= 20 || hour < 7);

            // 1) Global flag for the entire OutZen ecosystem
            window.OutZenIsNight = isNight;

            // 2) Class on <body> for your CSS theme
            document.addEventListener('DOMContentLoaded', function () {
                const body = document.body;
                if (!body) return;
            });
        })();
    </script>
    <!-- OutZen global Day / Night background -->
    <script>
        (() => {
            "use strict";

            const DAY_START_HOUR = 7;
            const NIGHT_START_HOUR = 20;
            const REFRESH_INTERVAL_MS = 60_000;

            let refreshTimerId = 0;

            function applyOutZenDayNightTheme() {
                const layer = document.getElementById("outzen-page-background");

                if (!layer) {console.warn("[OutZen Background] " + "#outzen-page-background not found.");

                    return;
                }

                const hour = new Date().getHours();

                const isNight = hour >= NIGHT_START_HOUR || hour < DAY_START_HOUR;

                const imageUrl = isNight ? "/images/night.jpg?v=20260730-bg4" : "/images/day.jpg?v=20260730-bg4";

                const overlay = isNight
                    ? [
                        "linear-gradient(",
                        "180deg,",
                        "rgba(1, 7, 20, 0.22) 0%,",
                        "rgba(1, 7, 20, 0.42) 55%,",
                        "rgba(1, 7, 20, 0.62) 100%",
                        ")"
                    ].join(" ")
                    : [
                        "linear-gradient(",
                        "180deg,",
                        "rgba(5, 15, 30, 0.10) 0%,",
                        "rgba(5, 15, 30, 0.24) 55%,",
                        "rgba(5, 15, 30, 0.46) 100%",
                        ")"
                    ].join(" ");

                /*
                 * Global state used by OutZen and the globe.
                 */
                window.OutZenIsNight = isNight;

                /*
                 * Theme classes.
                 */
                document.body.classList.toggle("night-mode", isNight);
                document.body.classList.toggle("day-mode", isNight);

                /*
                 * Direct application to the tracing paper.
                 *
                 * We no longer depend on :
                 * - --outzen-background-image ;
                 * - he Outzen waterfall.css ;
                 * - an <img> tag ;
                 * - a dynamic preload.
                 */
                layer.style.setProperty("background-image", `${overlay}, url("${imageUrl}")`, "important");
                layer.dataset.outzenMode = isNight ? "night" : "day";
                layer.dataset.outzenImage = imageUrl;

                console.info(
                    "[OutZen Background] Applied",
                    {
                        mode: layer.dataset.outzenMode,
                        imageUrl,
                        computedBackgroundImage:
                            getComputedStyle(layer)
                                .backgroundImage
                    }
                );
            }

            function initializeOutZenBackground() {applyOutZenDayNightTheme();

                if (refreshTimerId !== 0) {window.clearInterval(refreshTimerId);}

                refreshTimerId = window.setInterval(applyOutZenDayNightTheme, REFRESH_INTERVAL_MS);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", initializeOutZenBackground, { once: true });
            }
            else {initializeOutZenBackground();
            }
        })();
    </script>
    <script>
        window.checkWasmAccess = async function () {
            const candidates = ["/_framework/dotnet.native.wasm", "/_framework/dotnet.wasm"];

            for (const url of candidates) {
                try {
                    const response = await fetch(url, {
                        method: "GET",
                        cache: "no-store"
                    });

                    return {
                        url: url,
                        ok: response.ok,
                        status: response.status,
                        contentType: response.headers.get("content-type"),
                        contentLength: response.headers.get("content-length")
                    };
                }
                catch (e) {
                    return {url: url, ok: false, status: 0, error: e?.message ?? String(e)};
                }
            }
        };
    </script>

    <script>

        window.scrollInterop.getScrollTop = (el) => Math.trunc((el?.scrollTop ?? window.scrollY ?? 0) || 0);
        window.scrollInterop.getScrollHeight = (el) => Math.trunc(el?.scrollHeight ?? document.scrollingElement?.scrollHeight ?? 0);
        window.scrollInterop.getClientHeight = (el) => Math.trunc(el?.clientHeight ?? document.documentElement?.clientHeight ?? 0);

        // possible compat
        window.getScrollTop = window.scrollInterop.getScrollTop;
        window.getScrollHeight = window.scrollInterop.getScrollHeight;
        window.getClientHeight = window.scrollInterop.getClientHeight;
    </script>
